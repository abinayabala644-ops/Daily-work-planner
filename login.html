<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Daily Work Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --blue-700: #1d4ed8;
      --blue-800: #1e40af;
      --rose-600: #e11d48;
      --rose-700: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    @media (min-width: 480px) {
      .card {
        padding: 32px;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--slate-900);
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--slate-500);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--slate-800);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid var(--slate-300);
      border-radius: 8px;
      background: #ffffff;
      color: var(--slate-900);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus-visible {
      border-color: var(--slate-900);
      outline: 2px solid var(--slate-900);
      outline-offset: 1px;
    }

    .show-password-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
      min-height: 32px;
    }

    .show-password-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--slate-900);
    }

    .show-password-checkbox:focus-visible {
      outline: 2px solid var(--slate-900);
      outline-offset: 2px;
    }

    .show-password-label {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--slate-700);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      min-height: 44px;
      padding: 11px 18px;
      background: var(--slate-900);
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--slate-800);
    }

    .btn-submit:focus-visible {
      outline: 2px solid var(--slate-900);
      outline-offset: 2px;
    }

    .btn-submit:disabled {
      background: var(--slate-300);
      color: var(--slate-500);
      cursor: not-allowed;
    }

    /* Google Sign In Button */
    .btn-google {
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      background: #ffffff;
      color: var(--slate-800);
      border: 1px solid var(--slate-300);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover:not(:disabled) {
      background-color: var(--slate-50);
      border-color: var(--slate-400);
    }

    .btn-google:focus-visible {
      outline: 2px solid var(--slate-900);
      outline-offset: 2px;
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: var(--slate-400);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--slate-200);
    }

    .auth-divider:not(:empty)::before {
      margin-right: 0.75em;
    }

    .auth-divider:not(:empty)::after {
      margin-left: 0.75em;
    }

    .toggle-mode-container {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .toggle-text {
      font-size: 0.9rem;
      color: var(--slate-600);
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .forgot-link-btn {
      background: none;
      border: none;
      color: var(--blue-700);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      padding: 2px 4px;
    }

    .forgot-link-btn:hover {
      color: var(--blue-800);
    }

    .forgot-link-btn:focus-visible {
      outline: 2px solid var(--blue-700);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .toggle-mode-btn {
      background: none;
      border: none;
      color: var(--blue-700);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      min-height: 36px;
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-mode-btn:hover {
      color: var(--blue-800);
    }

    .toggle-mode-btn:focus-visible {
      outline: 2px solid var(--blue-700);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .message-area {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.45;
      display: none;
    }

    .message-area.error {
      display: block;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: var(--rose-700);
    }

    .message-area.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="login-header">
        <h1 id="auth-title" class="login-title">Daily Work Planner</h1>
        <p id="auth-subtitle" class="login-subtitle">Sign in to continue</p>
      </div>

      <!-- Google OAuth Button -->
      <div id="google-auth-container">
        <button type="button" id="google-auth-btn" class="btn-google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          <span id="google-auth-text">Continue with Google</span>
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>
      </div>

      <form id="auth-form" novalidate autocomplete="off">
        <!-- Hidden decoy inputs to absorb Chrome password manager autofill heuristics -->
        <input type="text" name="fake_username_remembered" style="display:none !important;" tabindex="-1" autocomplete="off" />
        <input type="password" name="fake_password_remembered" style="display:none !important;" tabindex="-1" autocomplete="off" />

        <!-- Full Name (Only for Sign Up) -->
        <div class="form-group" id="group-fullname" style="display: none;">
          <label for="auth-fullname" class="form-label">Full Name</label>
          <input
            type="text"
            id="auth-fullname"
            name="planner_auth_full_name"
            class="form-input"
            autocomplete="name"
            placeholder="John Doe"
          />
        </div>

        <!-- Email Address -->
        <div class="form-group" id="group-email">
          <label for="auth-email" class="form-label">Email Address</label>
          <input
            type="email"
            id="auth-email"
            name="planner_auth_user_email"
            class="form-input"
            autocomplete="email"
            placeholder="name@example.com"
            required
          />
        </div>

        <!-- Password -->
        <div class="form-group" id="group-password">
          <div class="form-label-row">
            <label for="auth-password" class="form-label" id="auth-password-label">Password</label>
            <button type="button" id="forgot-password-link" class="forgot-link-btn">Forgot Password?</button>
          </div>
          <input
            type="password"
            id="auth-password"
            name="planner_auth_user_token"
            class="form-input"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Confirm Password (Only for Sign Up and Reset Password) -->
        <div class="form-group" id="group-confirm-password" style="display: none;">
          <label for="auth-confirm-password" class="form-label" id="auth-confirm-password-label">Confirm Password</label>
          <input
            type="password"
            id="auth-confirm-password"
            name="planner_auth_confirm_token"
            class="form-input"
            autocomplete="new-password"
            placeholder="••••••••"
          />
        </div>

        <!-- Show Password Checkbox -->
        <div class="form-group" id="group-show-password" style="margin-bottom: 12px;">
          <label class="show-password-row">
            <input type="checkbox" id="toggle-password" class="show-password-checkbox" />
            <span class="show-password-label">Show Password</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="auth-submit-btn" class="btn-submit">
          <span id="auth-submit-spinner" class="spinner" style="display: none;"></span>
          <span id="auth-submit-text">Sign In</span>
        </button>
      </form>

      <div class="toggle-mode-container" id="toggle-mode-container">
        <span class="toggle-text" id="toggle-prompt-text">Don't have an account?</span>
        <button type="button" id="toggle-mode-btn" class="toggle-mode-btn">
          Create Account
        </button>
        <button type="button" id="back-to-signin-btn" class="toggle-mode-btn" style="display: none;">
          &larr; Back to Sign In
        </button>
      </div>

      <div id="auth-message" class="message-area" aria-live="polite"></div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
