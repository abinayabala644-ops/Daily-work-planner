<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 293" width="440" height="293">
  <defs>
    <linearGradient id="bgEncourage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="faceEncourage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowEncourage" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d97706" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="293" rx="16" fill="url(#bgEncourage)"/>

  <!-- Centered Emoji Avatar -->
  <g transform="translate(220, 146)">
    <!-- Face Background -->
    <circle r="72" fill="url(#faceEncourage)" filter="url(#shadowEncourage)" stroke="#b45309" stroke-width="2.5"/>

    <!-- Wink Left Eye (confident wink) -->
    <path d="M-40 -12 Q-26 -2 0 -12" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>

    <!-- Open Right Eye with highlight -->
    <circle cx="28" cy="-12" r="9" fill="#78350f"/>
    <circle cx="26" cy="-15" r="3" fill="#ffffff"/>

    <!-- Confident Eyebrows -->
    <path d="M-42 -26 Q-28 -34 -14 -28" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M14 -32 Q28 -36 42 -28" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Rosy Cheek on wink side -->
    <circle cx="-42" cy="8" r="9" fill="#f87171" opacity="0.45"/>
    <circle cx="42" cy="8" r="9" fill="#f87171" opacity="0.45"/>

    <!-- Encouraging Warm Smile -->
    <path d="M-28 14 Q0 42 28 14" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>

    <!-- Flexed Bicep / Muscle Icon on side -->
    <g transform="translate(74, 20)">
      <circle cx="0" cy="0" r="18" fill="#fde047" stroke="#b45309" stroke-width="2"/>
      <text x="-8" y="6" font-family="system-ui, sans-serif" font-size="15">💪</text>
    </g>

    <g transform="translate(-74, 20)">
      <circle cx="0" cy="0" r="18" fill="#fde047" stroke="#b45309" stroke-width="2"/>
      <text x="-8" y="6" font-family="system-ui, sans-serif" font-size="15">✨</text>
    </g>
  </g>
</svg>
