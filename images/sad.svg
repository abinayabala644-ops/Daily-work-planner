<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <!-- Background Rose Soft Glow Gradient -->
    <linearGradient id="bgSadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <!-- 3D Sphere Sphere Gradients -->
    <radialGradient id="sphereGradSad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specularGrad3" x1="0%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadowSad" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.18"/>
    </filter>

    <!-- Tear Droplet Gradient -->
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Container Rounded Plaque -->
  <rect width="500" height="320" rx="20" fill="url(#bgSadGrad)"/>
  <rect x="2" y="2" width="496" height="316" rx="18" fill="none" stroke="#fecdd3" stroke-width="2"/>

  <!-- Soft calming backdrop elements -->
  <circle cx="80" cy="80" r="5" fill="#f43f5e" opacity="0.25"/>
  <circle cx="420" cy="80" r="6" fill="#f43f5e" opacity="0.25"/>
  <circle cx="90" cy="240" r="4" fill="#f43f5e" opacity="0.25"/>
  <circle cx="410" cy="240" r="5" fill="#f43f5e" opacity="0.25"/>

  <!-- Central Emoji Character -->
  <g transform="translate(250, 155)">
    <!-- Main 3D Sphere -->
    <circle r="82" fill="url(#sphereGradSad)" filter="url(#softShadowSad)"/>

    <!-- Specular 3D Reflection overlay -->
    <ellipse cx="-24" cy="-34" rx="46" ry="28" fill="url(#specularGrad3)" transform="rotate(-25, -24, -34)"/>

    <!-- Big Expressive Pleading / Reflective Eyes -->
    <g transform="translate(-28, -6)">
      <circle cx="0" cy="0" r="16" fill="#451a03"/>
      <circle cx="-4" cy="-5" r="6" fill="#ffffff"/>
      <circle cx="5" cy="5" r="3" fill="#ffffff"/>
    </g>
    <g transform="translate(28, -6)">
      <circle cx="0" cy="0" r="16" fill="#451a03"/>
      <circle cx="-4" cy="-5" r="6" fill="#ffffff"/>
      <circle cx="5" cy="5" r="3" fill="#ffffff"/>
    </g>

    <!-- Sad / Compassionate Angled Eyebrows -->
    <path d="M-44 -30 C-34 -24 -22 -24 -12 -34" fill="none" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 -34 C22 -24 34 -24 44 -30" fill="none" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>

    <!-- Single 3D Tear Droplet -->
    <g transform="translate(44, 16)">
      <path d="M0 -8 C-4 0 -6 4 -6 8 C-6 12 -3 15 0 15 C3 15 6 12 6 8 C6 4 4 0 0 -8 Z" fill="url(#tearGrad)"/>
      <ellipse cx="-1.5" cy="8" rx="1.5" ry="3" fill="#ffffff" opacity="0.75"/>
    </g>

    <!-- Soft Sad / Pouting Mouth -->
    <path d="M-26 34 C-12 18 12 18 26 34" fill="none" stroke="#451a03" stroke-width="6" stroke-linecap="round"/>

    <!-- Soft Rose Blush -->
    <ellipse cx="-46" cy="18" rx="13" ry="8" fill="#fda4af" opacity="0.4"/>
    <ellipse cx="46" cy="18" rx="13" ry="8" fill="#fda4af" opacity="0.4"/>

    <!-- Bottom Reassuring Cloud Badge -->
    <g transform="translate(0, 94)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#be123c">Reset &amp; Retry</text>
    </g>
  </g>
</svg>
