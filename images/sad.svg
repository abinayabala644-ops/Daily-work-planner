<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 293" width="440" height="293">
  <defs>
    <linearGradient id="bgSad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="faceSad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadowSad" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#be123c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="293" rx="16" fill="url(#bgSad)"/>

  <!-- Centered Emoji Avatar -->
  <g transform="translate(220, 146)">
    <!-- Face Background -->
    <circle r="72" fill="url(#faceSad)" filter="url(#shadowSad)" stroke="#b45309" stroke-width="2.5"/>

    <!-- Sad/Pleading Big Eyes with Highlights -->
    <g transform="translate(-26, -10)">
      <circle cx="0" cy="0" r="13" fill="#713f12"/>
      <circle cx="-4" cy="-4" r="5" fill="#ffffff"/>
      <circle cx="4" cy="4" r="2.5" fill="#ffffff"/>
    </g>
    <g transform="translate(26, -10)">
      <circle cx="0" cy="0" r="13" fill="#713f12"/>
      <circle cx="-4" cy="-4" r="5" fill="#ffffff"/>
      <circle cx="4" cy="4" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Sad Slanted Eyebrows -->
    <path d="M-38 -32 Q-26 -28 -14 -38" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 -38 Q26 -28 38 -32" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>

    <!-- Gentle Tear Droplet on right cheek -->
    <path d="M38 10 C38 4, 46 4, 46 10 C46 16, 38 16, 38 10 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>

    <!-- Sad Downturned Mouth -->
    <path d="M-26 28 Q0 6 26 28" fill="none" stroke="#713f12" stroke-width="5" stroke-linecap="round"/>

    <!-- Soft blush -->
    <circle cx="-40" cy="14" r="8" fill="#fda4af" opacity="0.45"/>
    <circle cx="40" cy="14" r="8" fill="#fda4af" opacity="0.45"/>
  </g>
</svg>
